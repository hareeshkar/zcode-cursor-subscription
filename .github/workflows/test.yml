name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the floor the plugin declares; 24 is what it is developed against.
        node: [20, 22, 24]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Dev-only tooling: the type-checker. It is not shipped and adds no runtime
      # dependency, so installing it here does not weaken the promise below.
      - name: Install dev-only tooling
        working-directory: cursor-subscription
        run: npm install --no-audit --no-fund

      # The promise is "no *runtime* dependencies" — plain ESM on Node's standard
      # library, no build step. A dev-time type-checker is allowed; anything that
      # would ship is not.
      - name: Assert no runtime dependencies
        run: |
          node -e '
            const pkg = require("./cursor-subscription/package.json");
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              const n = Object.keys(pkg[field] ?? {}).length;
              if (n) throw new Error(`expected no ${field}, found ${n}: ${Object.keys(pkg[field]).join(", ")}`);
            }
            console.log("no runtime dependencies declared");
          '

      # Blocks the defect class that caused three separate bugs here: a value
      # that can be absent in two ways, written as one and read as the other.
      # `let toolCall = null` read by `!== undefined` discarded every checkpoint
      # Cursor ever sent. Only the null-safety codes fail the build; the rest are
      # a reported burn-down rather than a claim that the code is fully typed.
      - name: Type-check
        working-directory: cursor-subscription
        run: node scripts/typecheck.mjs

      - name: Verify the marketplace manifest matches the plugin
        run: |
          node -e '
            const fs = require("fs");
            const market = JSON.parse(fs.readFileSync("marketplace.json", "utf8"));
            const plugin = JSON.parse(fs.readFileSync("cursor-subscription/.zcode-plugin/plugin.json", "utf8"));
            const pkg = JSON.parse(fs.readFileSync("cursor-subscription/package.json", "utf8"));
            const entry = market.plugins.find((p) => p.name === plugin.name);
            if (!entry) throw new Error(`marketplace.json has no entry for ${plugin.name}`);
            for (const [label, v] of [["marketplace", entry.version], ["plugin.json", plugin.version], ["package.json", pkg.version]]) {
              if (v !== plugin.version) throw new Error(`version mismatch — ${label} says ${v}, plugin.json says ${plugin.version}`);
            }
            console.log(`versions agree: ${plugin.version}`);
          '

      - name: Test
        working-directory: cursor-subscription
        run: node --test test/*.test.mjs
